<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>figment — design tool</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8ecf4;
        overflow: hidden;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        grid-template-columns: 220px 1fr 240px;
        grid-template-areas:
          "top top top"
          "left stage right";
      }
      header {
        grid-area: top;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(148, 163, 204, 0.18);
        background: rgba(12, 16, 24, 0.9);
      }
      header h1 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: -0.02em;
      }
      header .spacer {
        flex: 1;
      }
      header button {
        font: inherit;
        font-size: 0.85rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 204, 0.22);
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        padding: 7px 12px;
        cursor: pointer;
      }
      header button.primary {
        background: #7c9cff;
        color: #0b0d12;
        border-color: transparent;
        font-weight: 650;
      }
      aside {
        overflow: auto;
        border-right: 1px solid rgba(148, 163, 204, 0.14);
        background: #0c1018;
        padding: 12px;
      }
      aside.right {
        border-right: 0;
        border-left: 1px solid rgba(148, 163, 204, 0.14);
      }
      aside h2 {
        margin: 0 0 10px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      #layers {
        height: calc(100% - 28px);
      }
      #stage {
        position: relative;
        min-width: 0;
      }
      figment-infinite-canvas {
        width: 100%;
        height: 100%;
      }
      figment-minimap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 4;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
        font-size: 0.85rem;
      }
      .field span {
        opacity: 0.75;
        font-size: 0.75rem;
      }
      .field input {
        font: inherit;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 204, 0.18);
        background: rgba(255, 255, 255, 0.04);
        color: inherit;
        padding: 8px 10px;
      }
      .hint {
        opacity: 0.55;
        font-size: 0.78rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>figment · design tool</h1>
        <button type="button" id="btn-add">Add frame</button>
        <button type="button" id="btn-fit">Fit</button>
        <div class="spacer"></div>
        <button type="button" id="btn-palette">⌘K</button>
        <button type="button" class="primary" id="btn-export">Export PNG</button>
      </header>

      <aside class="left">
        <h2>Layers</h2>
        <figment-virtual-list id="layers"></figment-virtual-list>
      </aside>

      <div id="stage">
        <figment-infinite-canvas id="canvas">
          <figment-layer-stack id="stack"></figment-layer-stack>
        </figment-infinite-canvas>
        <figment-minimap id="minimap"></figment-minimap>
      </div>

      <aside class="right">
        <h2>Inspector</h2>
        <label class="field">
          <span>Name</span>
          <input id="insp-name" type="text" value="Frame 1" />
        </label>
        <label class="field">
          <span>Material</span>
          <input id="insp-material" type="text" value="relief" />
        </label>
        <label class="field">
          <span>Z depth</span>
          <input id="insp-z" type="number" value="0" />
        </label>
        <p class="hint">
          Select a frame on the board. Export PNG uses <code>exportPng()</code>
          after a clean <code>paintOnce()</code>.
        </p>
      </aside>
    </div>

    <figment-command-palette id="palette"></figment-command-palette>
    <figment-toast id="toast">Ready</figment-toast>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
