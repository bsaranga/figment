<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>figment — spatial shell</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8ecf4;
        overflow: hidden;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(148, 163, 204, 0.18);
        background: rgba(12, 16, 24, 0.85);
        backdrop-filter: blur(12px);
      }
      header h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      header .hint {
        opacity: 0.65;
        font-size: 0.8rem;
      }
      #board {
        position: relative;
        min-height: 0;
      }
      figment-infinite-canvas {
        width: 100%;
        height: 100%;
      }
      figment-minimap {
        position: absolute;
        right: 16px;
        bottom: 16px;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>figment · spatial shell</h1>
        <div class="hint">
          Drag panels · scroll-zoom board · ⌘K commands · right-click menu
        </div>
      </header>
      <div id="board">
        <figment-infinite-canvas id="canvas">
          <figment-layer-stack id="stack"></figment-layer-stack>
        </figment-infinite-canvas>
        <figment-minimap id="minimap"></figment-minimap>
      </div>
    </div>
    <figment-command-palette id="palette"></figment-command-palette>
    <figment-context-menu id="menu"></figment-context-menu>
    <figment-tooltip id="tip">Spatial panel</figment-tooltip>
    <figment-toast id="toast">Welcome to the board</figment-toast>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
