<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>figment — vanilla mount</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d12;
        color: #e8ecf4;
      }
      main {
        display: grid;
        gap: 1rem;
        width: min(720px, 92vw);
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        opacity: 0.75;
        line-height: 1.5;
      }
      #stage {
        width: 100%;
        height: 320px;
        border: 1px solid #2a3140;
        border-radius: 12px;
        background: #12161f;
      }
      #status {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        color: #8b9bb4;
      }
      #status.ok {
        color: #3dd68c;
      }
      #status.err {
        color: #f07178;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>figment · vanilla mount</h1>
      <p>
        Surface runtime demo shell. Mounts DOM into an HTML-in-Canvas host
        (Chrome Canary + flags, or Chrome 157+ baseline).
      </p>
      <canvas id="stage" width="720" height="320" content="drawable"></canvas>
      <div id="status">booting…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
