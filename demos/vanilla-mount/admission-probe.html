<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>figment — M2 admission probes</title>
  </head>
  <body>
    <pre id="out">running…</pre>
    <script type="module">
      import {
        runPixelProbe,
        assertPixelProbe,
        runHitProbe,
        assertHitProbe,
        assertAdmission,
        createHost,
      } from "@figment/host";

      window.__admission = {
        runPixelProbe,
        assertPixelProbe,
        runHitProbe,
        assertHitProbe,
        assertAdmission,
        createHost,
      };

      const out = document.getElementById("out");
      try {
        const r = await assertAdmission();
        out.textContent = JSON.stringify(r, null, 2);
        out.dataset.ok = "yes";
      } catch (e) {
        out.textContent = String(e);
        out.dataset.ok = "no";
      }
    </script>
  </body>
</html>
